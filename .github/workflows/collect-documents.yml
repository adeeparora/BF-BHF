name: Collect Bajaj documents
on:
  push:
    paths:
      - 'scripts/collect_documents.py'
      - 'sources/seed.json'
      - '.github/workflows/collect-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bajaj-document-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/collect_documents.py
      - name: Commit collected PDFs and source catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BF BHF catalog
          if ! git diff --cached --quiet; then
            git commit -m "Archive Bajaj Finance and Bajaj Housing Finance public documents"
            git push
          fi
